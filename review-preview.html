<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Преглед на автоматични разпознавания</title><style>:root{--g:#285c38;--p:#fbf8f1;--i:#17251b;--l:#d8d1c3}*{box-sizing:border-box}body{margin:0;background:#edf1eb;color:var(--i);font:16px/1.5 system-ui,sans-serif}header{background:var(--g);color:#fff;padding:28px max(18px,calc((100% - 1240px)/2))}h1{margin:0;font:700 30px Georgia,serif}main{max-width:1240px;margin:25px auto;padding:0 18px}.notice,.error{padding:14px 16px;border-radius:10px;margin:0 0 20px;background:#fff3dc;border-left:5px solid #d88b18}.error{background:#fde7e7;border-color:#b63232}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;overflow:hidden;box-shadow:0 4px 14px #1f301515}.card img{display:block;width:100%;height:250px;object-fit:cover;background:#dfe7df}.body{padding:16px}h2{font:700 22px Georgia,serif;margin:0}.latin{font:italic 16px Georgia,serif;color:var(--g);margin:3px 0 10px}.file{font:12px ui-monospace,monospace;color:#687268;overflow-wrap:anywhere}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.high{background:#dff3e3;color:#155b2b}.medium{background:#fff0d3;color:#815000}.low{background:#fde0e0;color:#90252a}.row{margin:12px 0}.row b{display:block;font-size:13px;color:#536156}.review{margin-top:14px;padding:10px;background:#fff3dc;border-left:4px solid #d88b18;font-size:13px}@media(max-width:600px){header{padding:20px 18px}h1{font-size:24px}.card img{height:220px}}</style><body><header><h1>Предварителни автоматични разпознавания</h1><p>Преглед преди човешка ботаническа проверка и production deploy</p></header><main><div class="notice"><b>Внимание:</b> Всички резултати са автоматични и не са окончателна ботаническа идентификация.</div><div id="status">Зареждане на резултатите…</div><section id="grid" class="grid" hidden></section></main><script>const $=s=>document.querySelector(s),val=(o,...k)=>{for(const x of k){let v=o?.[x];if(Array.isArray(v))v=v.join('; ');if(v!==undefined&&v!==null&&v!=='')return String(v)}return 'Няма данни'};const image=f=>/^(https?:|\/)/.test(f)||f.includes('/')?f:'images/review/'+f;function records(d){return Array.isArray(d)?d:Array.isArray(d.results)?d.results:Array.isArray(d.items)?d.items:Array.isArray(d.reviews)?d.reviews:[]}function conf(x){x=String(x).toLowerCase();return ['high','medium','low'].includes(x)?x:'low'}function card(r){const f=val(r,'file_name','filename','file','image_file','image','source_file'),c=conf(val(r,'confidence','confidence_level'));return `<article class="card"><img src="${image(f)}" alt="${f}" onerror="this.alt='Снимката не е намерена';this.style.display='none'"><div class="body"><div class="file">${f}</div><h2>${val(r,'bulgarian_name','common_name_bg','common_name','name')}</h2><div class="latin">${val(r,'latin_name','scientific_name','scientific')}</div><span class="badge ${c}">Увереност: ${c}</span><div class="row"><b>Семейство</b>${val(r,'family','family_name')}</div><div class="row"><b>Видими белези</b>${val(r,'visible_traits','traits','key_features','features')}</div><div class="row"><b>Възможни двойници</b>${val(r,'possible_lookalikes','lookalikes','doubles')}</div><div class="row"><b>Нужни допълнителни снимки</b>${val(r,'additional_photos_needed','needed_photos','additional_images')}</div><div class="row"><b>Бележка за безопасност</b>${val(r,'safety_note','safety','safety_notes')}</div><div class="review">Предварително автоматично разпознаване — изисква човешка ботаническа проверка.</div></div></article>`}fetch('data/review-results.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{const a=records(d);if(!a.length)throw Error('Няма разпознаваеми записи');$('#status').textContent=`Заредени записи: ${a.length}`;$('#grid').innerHTML=a.map(card).join('');$('#grid').hidden=false}).catch(e=>$('#status').outerHTML='<div class="error"><b>Резултатите не могат да бъдат заредени.</b> Провери дали data/review-results.json е наличен и страницата се отваря през уеб сървър.</div>')</script></body></html>
